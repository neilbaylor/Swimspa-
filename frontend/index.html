<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b3d5c" />
  <title>Swim Spa Control</title>
  <style>
    :root {
      --bg1: #0b3d5c;
      --bg2: #0a5e7a;
      --accent: #2dd4bf;
      --card: rgba(255, 255, 255, 0.08);
      --text: #eaf6ff;
      --muted: #9fc4d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, var(--bg2), var(--bg1) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 24px 32px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .name { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.3px; }
    .demo-badge {
      display: none;
      margin-top: 6px;
      font-size: 0.7rem;
      color: #06283d;
      background: var(--accent);
      border-radius: 999px;
      padding: 2px 10px;
    }
    .current {
      margin-top: 18px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
    }
    .current .value { font-size: 3.6rem; font-weight: 700; line-height: 1; margin-top: 4px; }
    .current .unit { font-size: 1.4rem; color: var(--muted); }
    .operation {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--accent);
      min-height: 1.2em;
    }
    .setpoint {
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .setpoint .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
    }
    .setpoint .target { font-size: 2.2rem; font-weight: 700; }
    button.adjust {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      font-size: 2rem;
      font-weight: 700;
      color: #06283d;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease;
      box-shadow: 0 8px 20px rgba(45, 212, 191, 0.35);
    }
    button.adjust:active { transform: scale(0.92); }
    button.adjust:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
    .devices {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .device {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .device .dname { font-size: 0.95rem; font-weight: 600; text-align: left; }
    .device .dstate { font-size: 0.72rem; color: var(--muted); text-align: left; }
    .device button {
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #06283d;
      background: rgba(255, 255, 255, 0.5);
      min-width: 72px;
      transition: background 0.2s ease, transform 0.08s ease;
    }
    .device button.on { background: var(--accent); }
    .device button:active { transform: scale(0.94); }
    .device button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .status.error { color: #ffb4b4; }
    .dot {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 6px;
      background: #ff7b7b;
    }
    .dot.online { background: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="name" id="spa-name">Swim Spa</div>
    <div class="demo-badge" id="demo-badge">DEMO MODE</div>

    <div class="current">
      Water Temperature
      <div><span class="value" id="current-temp">--</span><span class="unit" id="current-unit"></span></div>
    </div>
    <div class="operation" id="operation"></div>

    <div class="setpoint">
      <button class="adjust" id="btn-down" aria-label="Decrease temperature">&minus;</button>
      <div>
        <div class="label">Set To</div>
        <div class="target"><span id="target-temp">--</span><span id="target-unit"></span></div>
      </div>
      <button class="adjust" id="btn-up" aria-label="Increase temperature">&plus;</button>
    </div>

    <div class="devices" id="devices"></div>

    <div class="status" id="status"><span class="dot" id="dot"></span><span id="status-text">Connecting…</span></div>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const fmt = (t) => (t == null ? "--" : Number(t).toFixed(1).replace(/\.0$/, ""));

    let busy = false;

    function render(s) {
      el("spa-name").textContent = s.spa_name || "Swim Spa";
      el("demo-badge").style.display = s.demo ? "inline-block" : "none";

      const dot = el("dot");
      if (s.connected) {
        dot.classList.add("online");
        el("current-temp").textContent = fmt(s.current_temperature);
        el("current-unit").textContent = s.unit || "";
        el("target-temp").textContent = fmt(s.target_temperature);
        el("target-unit").textContent = s.unit || "";
        el("operation").textContent = s.operation ? s.operation : "";
        el("status").classList.remove("error");
        el("status-text").textContent = "Connected";
        el("btn-up").disabled = busy;
        el("btn-down").disabled = busy;
        renderDevices(s.devices || []);
      } else {
        dot.classList.remove("online");
        el("current-temp").textContent = "--";
        el("target-temp").textContent = "--";
        el("operation").textContent = "";
        el("status").classList.add("error");
        el("status-text").textContent = s.error || "Not connected";
        el("btn-up").disabled = true;
        el("btn-down").disabled = true;
        el("devices").innerHTML = "";
      }
    }

    function renderDevices(devices) {
      const wrap = el("devices");
      wrap.innerHTML = "";
      for (const d of devices) {
        const row = document.createElement("div");
        row.className = "device";

        const info = document.createElement("div");
        const stateText = d.kind === "pump"
          ? (d.mode || (d.is_on ? "On" : "Off"))
          : (d.is_on ? "On" : "Off");
        info.innerHTML = `<div class="dname">${d.name}</div><div class="dstate">${stateText}</div>`;

        const btn = document.createElement("button");
        if (d.kind === "pump") {
          // Cycle through the pump's available modes (OFF, LO, HI...).
          btn.textContent = d.mode || (d.is_on ? "On" : "Off");
          if (d.is_on) btn.classList.add("on");
          btn.onclick = () => {
            const modes = d.modes && d.modes.length ? d.modes : ["OFF", "HI"];
            const next = modes[(modes.indexOf(d.mode) + 1) % modes.length];
            control(d.id, { mode: next });
          };
        } else {
          btn.textContent = d.is_on ? "On" : "Off";
          if (d.is_on) btn.classList.add("on");
          btn.onclick = () => control(d.id, { on: !d.is_on });
        }
        btn.disabled = busy;

        row.appendChild(info);
        row.appendChild(btn);
        wrap.appendChild(row);
      }
    }

    async function control(deviceId, body) {
      if (busy) return;
      busy = true;
      try {
        const r = await fetch(`/api/device/${encodeURIComponent(deviceId)}`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        render(await r.json());
      } catch (e) {
        /* next poll will recover */
      } finally {
        busy = false;
      }
    }

    async function refresh() {
      try {
        const r = await fetch("/api/status");
        render(await r.json());
      } catch (e) {
        render({ connected: false, error: "Cannot reach server" });
      }
    }

    async function adjust(direction) {
      if (busy) return;
      busy = true;
      el("btn-up").disabled = true;
      el("btn-down").disabled = true;
      try {
        const r = await fetch(`/api/temperature/${direction}`, { method: "POST" });
        render(await r.json());
      } catch (e) {
        /* next poll will recover */
      } finally {
        busy = false;
      }
    }

    el("btn-up").addEventListener("click", () => adjust("up"));
    el("btn-down").addEventListener("click", () => adjust("down"));

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
